# Quadrant theme. Colours and fonts live here, not in CSS.
# Light: chart paper and ink. Dark: night watch with brass.
# License: AGPL-3.0-or-later

[browser]
# The app collects no analytics.
gatherUsageStats = false

[theme]
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.4rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1c3557"
linkColor = "#1c3557"
backgroundColor = "#fbf9f4"
secondaryBackgroundColor = "#f1ede3"
textColor = "#1a2233"
borderColor = "#d9d2c0"

[theme.dark]
primaryColor = "#d9b56a"
linkColor = "#d9b56a"
backgroundColor = "#0d1522"
secondaryBackgroundColor = "#16213a"
textColor = "#ece7da"
borderColor = "#2c3a57"
