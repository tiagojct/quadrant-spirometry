[project]
name = "quadrant-streamlit"
version = "0.1.0"
description = "Quadrant: spirometry reference value calculator, Streamlit port"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pyspiro>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
